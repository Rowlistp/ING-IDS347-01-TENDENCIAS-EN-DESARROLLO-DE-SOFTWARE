name: Mobile Phase 5

on:
  pull_request:
    paths: ["mobile/**", "backend/**", ".github/workflows/mobile.yml"]
  push:
    branches: [feature/builder2-fase5-mobile-despacho]
    paths: ["mobile/**", "backend/**", ".github/workflows/mobile.yml"]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Install pinned official Flutter SDK
        run: |
          git clone --depth 1 --branch 3.47.2 https://github.com/flutter/flutter.git "$RUNNER_TEMP/fueltrack-flutter"
          echo "$RUNNER_TEMP/fueltrack-flutter/bin" >> "$GITHUB_PATH"
      - name: Resolve locked dependencies
        working-directory: mobile
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        working-directory: mobile
        run: flutter analyze
      - name: Unit and widget tests
        working-directory: mobile
        run: flutter test
      - name: Live Flutter API PostgreSQL E2E
        run: bash backend/scripts/run-mobile-e2e.sh
      - name: Build debug APK
        working-directory: mobile
        run: flutter build apk --debug
      - name: Upload APK for tester configuration check
        uses: actions/upload-artifact@v4
        with:
          name: fueltrack-phase5-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
